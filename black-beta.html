<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050507">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Tweakr Black beta testing: verify your license to access pre-release premium builds and send feedback.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), interest-cohort=()">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://vtonvtzhtkwksydpilwf.supabase.co; form-action 'self'; base-uri 'self'; object-src 'none';">
    <title>Black Beta — Tweakr</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --color-bg-dark: #050507;
            --color-tweakr-blue: #00f2fe;
        }
        body { font-family: var(--font-sans); background-color: var(--color-bg-dark); color: #ffffff; margin: 0; min-height: 100vh; }
        .squircle { border-radius: 22px; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .badge-glow {
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
            border: 1px solid rgba(0, 242, 254, 0.6);
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }
        .btn-blue { background-color: #00f2fe; color: #000; transition: all 0.3s ease; }
        .btn-blue:hover:not(:disabled) { box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); transform: translateY(-2px); }
        .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); }
        .bg-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
        }
        .auth-field {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .auth-field:focus {
            outline: none;
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 0 1px rgba(0, 242, 254, 0.25), 0 0 18px rgba(0, 242, 254, 0.12);
        }
        .license-key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.04em; }
    </style>
</head>
<body class="bg-bg-dark text-white bg-grid relative overflow-x-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(0,242,254,0.05)_0%,transparent_50%)] pointer-events-none"></div>

    <main class="container mx-auto px-6 py-16 relative z-10 min-h-screen flex flex-col items-center">
        <div class="w-full max-w-3xl mb-12 flex justify-between items-center text-sm">
            <a href="{{ site.baseurl }}/" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="font-medium tracking-wide">Home</span>
            </a>
            <div id="authNav" class="flex items-center gap-2"></div>
        </div>

        <div class="w-full max-w-3xl mb-10">
            <span class="px-3 py-1 text-xs font-semibold uppercase tracking-wider rounded-full badge-glow">Premium beta</span>
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mt-4 mb-3 bg-gradient-to-br from-white via-white to-gray-500 text-transparent bg-clip-text">Tweakr Black Beta</h1>
            <p class="text-gray-400 font-light">Verify your purchase email or license key to unlock pre-release premium builds.</p>
        </div>

        <!-- License gate -->
        <div id="gateState" class="w-full max-w-3xl">
            <div class="squircle glass-panel p-8">
                <h2 class="text-2xl font-semibold tracking-tight mb-2">Verify your license</h2>
                <p class="text-gray-400 font-light mb-6">Use the same email and key from your purchase.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase tracking-[0.18em] text-gray-500 mb-2 font-medium">Purchase email</label>
                        <input id="gateEmail" type="email" placeholder="you@example.com" autocomplete="email" class="auth-field w-full rounded-lg px-4 py-3 text-sm" />
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-[0.18em] text-gray-500 mb-2 font-medium">License key</label>
                        <input id="gateKey" type="text" placeholder="TWEAKR-FULL-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" class="auth-field license-key w-full rounded-lg px-4 py-3 text-sm" />
                    </div>
                    <p id="gateError" class="text-sm text-[#ff8a8a] font-light"></p>
                    <button id="gateBtn" class="squircle btn-blue py-3.5 px-6 font-semibold tracking-wide shadow-lg">Unlock beta</button>
                </div>
            </div>
        </div>

        <!-- Beta content lives on the access page (shown after unlock) -->

        <div class="w-full max-w-3xl mt-10 text-center text-sm text-gray-500 font-light">
            <a href="{{ site.baseurl }}/" class="hover:text-white transition-colors">Home</a>
            <span class="mx-2">·</span>
            <a href="{{ site.baseurl }}/grey-beta" class="hover:text-white transition-colors">Grey Beta</a>
            <span class="mx-2">·</span>
            <a href="{{ site.baseurl }}/faq" class="hover:text-white transition-colors">FAQ</a>
            <span class="mx-2">·</span>
            <a href="https://www.instagram.com/twea.kr/" target="_blank" rel="noopener" class="hover:text-white transition-colors inline-flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>
                Contact
            </a>
        </div>
    </main>

    <script src="{{ site.baseurl }}/assets/banner.js" data-audience="black"></script>
    <script src="{{ site.baseurl }}/assets/auth.js"></script>
    <script>
        var VERIFY_URL = "https://vtonvtzhtkwksydpilwf.supabase.co/functions/v1/verify-license";

        // A verified key takes you to the beta access page, which re-verifies
        // live and shows current progress + feedback.
        function goAccess(email, key) {
            var params = new URLSearchParams({ email: email, key: key });
            window.location.href = "{{ site.baseurl }}/black-beta-access?" + params.toString();
        }

        // If this browser already unlocked, skip the gate.
        try {
            var saved = JSON.parse(sessionStorage.getItem("black_beta") || "null");
            if (saved && saved.email && saved.key) goAccess(saved.email, saved.key);
        } catch (e) {}

        document.getElementById("gateBtn").addEventListener("click", async function () {
            var errEl = document.getElementById("gateError");
            var btn = document.getElementById("gateBtn");
            errEl.textContent = "";
            var email = document.getElementById("gateEmail").value.trim().toLowerCase();
            var key = document.getElementById("gateKey").value.trim().toUpperCase();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = "Enter your purchase email."; return; }
            if (!key) { errEl.textContent = "Enter your license key."; return; }
            btn.disabled = true;
            try {
                var resp = await fetch(VERIFY_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ key: key })
                });
                var data = await resp.json();
                if (data && data.success && (data.tier === "full" || data.tier === "starter")) {
                    try { sessionStorage.setItem("black_beta", JSON.stringify({ email: email, key: key })); } catch (e) {}
                    goAccess(email, key);
                } else {
                    errEl.textContent = (data && data.error) || "That key did not verify. Check it and try again.";
                }
            } catch (e) {
                errEl.textContent = "Network error. Check your connection and try again.";
            }
            btn.disabled = false;
        });
    </script>
    <script src="{{ site.baseurl }}/assets/auth-nav.js?v=2"></script>
</body>
</html>
