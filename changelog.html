<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050507">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Tweakr changelog — every release, patch, and new feature, newest first.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), interest-cohort=()">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://vtonvtzhtkwksydpilwf.supabase.co; form-action 'self'; base-uri 'self'; object-src 'none';">
    <title>Changelog — Tweakr</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --color-bg-dark: #050507;
            --color-tweakr-blue: #00f2fe;
        }
        body { font-family: var(--font-sans); background-color: var(--color-bg-dark); color: #ffffff; margin: 0; min-height: 100vh; }
        .squircle { border-radius: 22px; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
        }
        .tag-new { color: #7ef0d0; border: 1px solid rgba(126, 240, 208, 0.5); background: rgba(126, 240, 208, 0.08); }
        .tag-improvement { color: #7ec8f0; border: 1px solid rgba(126, 200, 240, 0.5); background: rgba(126, 200, 240, 0.08); }
        .tag-fix { color: #f0b27e; border: 1px solid rgba(240, 178, 126, 0.5); background: rgba(240, 178, 126, 0.08); }
        .timeline-dot { box-shadow: 0 0 12px rgba(0, 242, 254, 0.6); }
    </style>
</head>
<body class="bg-bg-dark text-white bg-grid relative overflow-x-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(0,242,254,0.05)_0%,transparent_50%)] pointer-events-none"></div>

    <main class="container mx-auto px-6 py-16 relative z-10 min-h-screen flex flex-col items-center">
        <div class="w-full max-w-3xl mb-12 flex justify-between items-center text-sm">
            <a href="{{ site.baseurl }}/" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="font-medium tracking-wide">Home</span>
            </a>
            <div id="authNav" class="flex items-center gap-2"></div>
        </div>

        <div class="w-full max-w-3xl mb-10">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-3 bg-gradient-to-br from-white via-white to-gray-500 text-transparent bg-clip-text">What's New</h1>
            <p class="text-gray-400 font-light">Every Tweakr release, newest first.</p>
        </div>

        <div id="feed" class="w-full max-w-3xl space-y-8">
            <p class="text-gray-500 font-light text-center py-8">Loading changelog…</p>
        </div>

        <div class="w-full max-w-3xl mt-10 text-center text-sm text-gray-500 font-light">
            <a href="{{ site.baseurl }}/" class="hover:text-white transition-colors">Home</a>
            <span class="mx-2">·</span>
            <a href="{{ site.baseurl }}/faq" class="hover:text-white transition-colors">FAQ</a>
        </div>
    </main>

    <script>
        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
        }
        var TAG_LABEL = { "new": "New Feature", "improvement": "Improvement", "fix": "Bug Fix" };
        var TAG_CLASS = { "new": "tag-new", "improvement": "tag-improvement", "fix": "tag-fix" };

        fetch("{{ site.baseurl }}/assets/changelog.json", { cache: "no-store" })
            .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
            .then(function (data) {
                var feed = document.getElementById("feed");
                var versions = (data && data.versions) || [];
                if (!versions.length) {
                    feed.innerHTML = '<p class="text-gray-500 font-light text-center py-8">No releases yet.</p>';
                    return;
                }
                feed.innerHTML = versions.map(function (v) {
                    var changes = (v.changes || []).map(function (c) {
                        var cls = TAG_CLASS[c.tag] || TAG_CLASS["improvement"];
                        var label = TAG_LABEL[c.tag] || "Improvement";
                        return '<li class="flex items-start gap-3">' +
                            '<span class="mt-0.5 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider rounded-full shrink-0 ' + cls + '">' + esc(label) + '</span>' +
                            '<span class="text-gray-300 font-light leading-relaxed text-[15px]">' + esc(c.text) + '</span></li>';
                    }).join("");
                    return '<article class="relative pl-8">' +
                        '<span class="timeline-dot absolute left-0 top-2 h-2.5 w-2.5 rounded-full bg-[#00f2fe]"></span>' +
                        '<span class="absolute left-[4px] top-6 bottom-[-2rem] w-px bg-white/10"></span>' +
                        '<div class="squircle glass-panel p-6 md:p-8">' +
                        '<div class="flex flex-wrap items-center gap-3 mb-1">' +
                        '<h2 class="text-2xl font-semibold tracking-tight">' + esc(v.version) + '</h2>' +
                        '<span class="px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-wider rounded-full border border-white/15 bg-white/5 text-gray-300">' + esc(v.badge || "Release") + '</span></div>' +
                        '<p class="text-xs text-gray-500 mb-5 font-light">' + esc(v.date || "") + '</p>' +
                        '<ul class="space-y-3">' + changes + '</ul></div></article>';
                }).join("");
            })
            .catch(function () {
                document.getElementById("feed").innerHTML =
                    '<p class="text-gray-500 font-light text-center py-8">Could not load the changelog. Check your connection and refresh.</p>';
            });
    </script>
    <script src="{{ site.baseurl }}/assets/auth.js"></script>
    <script src="{{ site.baseurl }}/assets/auth-nav.js"></script>
</body>
</html>
